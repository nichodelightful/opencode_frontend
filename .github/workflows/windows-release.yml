name: Build Windows Distribution

on:
  push:
    branches:
      - windows
  workflow_dispatch:

concurrency:
  group: windows-distribution-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=windows
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows-installer:
    needs: container
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish launcher
        shell: pwsh
        run: |
          dotnet restore .\launcher\AIChatBox.Launcher\AIChatBox.Launcher.csproj
          dotnet publish .\launcher\AIChatBox.Launcher\AIChatBox.Launcher.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output .\artifacts\launcher

      - name: Download WebView2 bootstrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts\installer-deps | Out-Null
          Invoke-WebRequest `
            -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile .\artifacts\installer-deps\MicrosoftEdgeWebview2Setup.exe

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=0.1.${{ github.run_number }}" ".\installer\AIChatBox.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: AIChatBox-Launcher-win-x64
          path: artifacts/launcher/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: AIChatBox-Setup-win-x64
          path: artifacts/installer/*.exe
          if-no-files-found: error
          retention-days: 30
