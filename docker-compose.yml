services:
  app:
    build: .
    container_name: ai-chatbox
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOME: /home/nextjs
      WORKSPACE_ROOT: /data/workspaces
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH in .env}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      OPENCODE_BIN: ${OPENCODE_BIN:-opencode}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
      OPENCODE_MODEL_OPTIONS: ${OPENCODE_MODEL_OPTIONS:-}
      OPENCODE_TIMEOUT_MS: ${OPENCODE_TIMEOUT_MS:-600000}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - workspaces:/data/workspaces
      - ${OPENCODE_AUTH_DIR}:/home/nextjs/.local/share/opencode
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: "on-failure:5"
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy

volumes:
  workspaces:
