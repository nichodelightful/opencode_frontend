services:
  app:
    build: .
    container_name: ai-chatbox
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOME: /home/nextjs
      WORKSPACE_ROOT: /data/workspaces
      OPENCODE_BIN: ${OPENCODE_BIN:-opencode}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
      OPENCODE_MODEL_OPTIONS: ${OPENCODE_MODEL_OPTIONS:-}
      OPENCODE_TIMEOUT_MS: ${OPENCODE_TIMEOUT_MS:-180000}
    ports:
      - "3000:3000"
    volumes:
      - workspaces:/data/workspaces
      - ${OPENCODE_AUTH_DIR}:/home/nextjs/.local/share/opencode

volumes:
  workspaces:
